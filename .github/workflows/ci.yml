name: CI — Test & Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  server-test:
    name: Server Tests (131 cases)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123456
          MYSQL_DATABASE: campus_order
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run migrations
        working-directory: server
        env:
          DATABASE_URL: mysql://root:root123456@localhost:3306/campus_order?charset=utf8mb4
        run: npx prisma migrate deploy

      - name: Seed database
        working-directory: server
        env:
          DATABASE_URL: mysql://root:root123456@localhost:3306/campus_order?charset=utf8mb4
        run: npx ts-node prisma/seed.ts

      - name: Run unit tests
        working-directory: server
        env:
          DATABASE_URL: mysql://root:root123456@localhost:3306/campus_order?charset=utf8mb4
          JWT_SECRET: dev-jwt-secret-change-in-production
          WECHAT_APP_ID: wx8ebfaf4a045bf7c3
          WECHAT_APP_SECRET: test-secret
        run: npm test -- --forceExit

      - name: TypeScript check
        working-directory: server
        run: npx tsc --noEmit

  admin-web-build:
    name: Admin Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install & Build
        working-directory: admin-web
        run: |
          npm ci
          npm run build

  miniprogram-build:
    name: Miniprogram Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json

      - name: Install & Build
        working-directory: miniprogram
        run: |
          npm ci
          node node_modules/@dcloudio/vite-plugin-uni/bin/uni.js build -p mp-weixin

  packager-test:
    name: Packager Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packager/package-lock.json

      - name: Install & Test
        working-directory: packager
        run: |
          npm ci
          npm test
